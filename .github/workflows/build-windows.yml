name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    # Pin VS2022 rather than following the moving windows-latest label.
    runs-on: windows-2022

    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v6

      - name: Checkout JUCE 8.0.15
        uses: actions/checkout@v6
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: JUCE
          fetch-depth: 1

      - name: Tool versions
        shell: pwsh
        run: |
          cmake --version
          git --version
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DFETCHCONTENT_SOURCE_DIR_JUCE=$env:GITHUB_WORKSPACE/JUCE"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --target AKNStepFilter_VST3 --parallel 2

      - name: Package
        shell: pwsh
        run: ./tools/PackageWindows.ps1 -BuildDir build -OutDir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: AKN-Step-Filter-Windows-x64
          path: dist/AKN-Step-Filter-Windows-x64.zip
          if-no-files-found: error
